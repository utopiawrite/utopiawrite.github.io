<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Zina 的公開追劇清單：推薦劇集、觀看進度、星級與簡短評語。">
  <meta name="theme-color" content="#6f416d">
  <title>Zina 的追劇清單</title>
  <style>
    :root{--ink:#211d29;--muted:#716b79;--paper:#f7f3ed;--card:#fffdf9;--line:#e6ded4;--plum:#6f416d;--gold:#e5a51b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 86% 4%,#eadce6 0,transparent 28%),var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;min-height:100vh}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:54px 0 72px}.eyebrow{color:var(--plum);font:700 11px/1.2 Arial,sans-serif;letter-spacing:.2em;margin:0 0 10px}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(38px,7vw,66px);font-weight:500;letter-spacing:-.04em;line-height:1;margin:0}.intro{color:var(--muted);line-height:1.7;margin:16px 0 30px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.tabs{display:flex;gap:6px;background:#ede6df;padding:5px;border-radius:999px}.tab{border:0;background:transparent;color:var(--muted);padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer}.tab.active{background:var(--card);color:var(--ink);box-shadow:0 3px 10px rgba(45,30,40,.08)}.search{min-width:280px;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:12px 16px;font:inherit;color:var(--ink)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}.filter.active{border-color:var(--plum);color:var(--plum);background:#f2e8f0}.list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.item{padding:18px 22px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge,.rating{font-size:12px;padding:4px 8px;border-radius:99px;background:#eee8e1;color:var(--muted)}.badge.complete{background:#e3eee8;color:#406b56}.badge.incomplete{background:#f7e6de;color:#9b584f}.badge.watching{background:#eee4f0;color:var(--plum)}.rating{display:inline-flex;align-items:center;gap:5px;background:#fff4cf;color:#735d25;font-weight:700}.stars{--fill:0%;position:relative;color:#d8d1c8;letter-spacing:1px;line-height:1;white-space:nowrap}.stars::before{content:"★★★★★";position:absolute;inset:0;width:var(--fill);overflow:hidden;color:var(--gold);white-space:nowrap}.title-line{display:flex;align-items:flex-start;gap:10px}.item h2{flex:1;font-size:20px;line-height:1.45;margin:10px 0 4px}.copy-title{flex:none;margin-top:8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--plum);padding:6px 10px;font:700 12px/1 inherit;cursor:pointer}.copy-title.copied{background:#e3eee8;color:#406b56}.meta,.review{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.review{margin-top:6px;color:#554f5a}.empty{padding:64px 20px;text-align:center;color:var(--muted)}.updated{font-size:12px;color:var(--muted);text-align:right;margin-top:12px}.home{display:inline-block;margin-top:28px;color:var(--plum);text-decoration:none;font-weight:700}.home:hover{text-decoration:underline}
    @media(max-width:680px){.shell{padding-top:32px}.toolbar{align-items:stretch;flex-direction:column}.search{min-width:0;width:100%}.tabs{align-self:flex-start}.item{padding:15px 14px}.item h2{font-size:17px}.badge,.rating{font-size:11px}}
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">ZINA'S DRAMA JOURNAL</p>
    <h1>我的追劇清單</h1>
    <p class="intro">最近在看什麼、看到了哪裡，還有我給它的星級與簡短感想。</p>
    <div class="toolbar">
      <div class="tabs"><button class="tab active" data-view="watched">觀看紀錄</button><button class="tab" data-view="recommend">推薦清單</button></div>
      <input class="search" id="search" type="search" placeholder="搜尋劇名或評語" aria-label="搜尋劇名或評語">
    </div>
    <div class="filters" id="filters"></div>
    <section class="list" id="list"><div class="empty">正在載入追劇清單…</div></section>
    <p class="updated" id="updated"></p>
    <a class="home" href="/">← 回到 zinaliu.com</a>
  </main>
  <script>
    const API='https://my-drama-journal-20261103.utopiawrite.chatgpt.site/api/public/entries';
    let entries=[],view='watched',filter='全部';
    const $=id=>document.getElementById(id);
    const escapeHtml=(value='')=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const normalizedRating=value=>{const n=Number(value);return Number.isFinite(n)&&n>0?Math.min(5,n>5?n/2:n):0};
    const stars=value=>{const n=normalizedRating(value);if(!n)return '';return `<span class="rating" aria-label="${n} 星"><span class="stars" style="--fill:${n/5*100}%">★★★★★</span><span>${n}</span></span>`};
    function renderFilters(){const values=view==='watched'?['全部','想看','觀看中','已看完','暫停','棄劇']:['全部','已完結','未完結','不確定'];$('filters').innerHTML=values.map(x=>`<button class="filter ${x===filter?'active':''}" data-filter="${x}">${x}</button>`).join('')}
    function render(){renderFilters();const q=$('search').value.trim().toLowerCase();const shown=entries.filter(x=>x.listType===view).filter(x=>filter==='全部'||(view==='watched'?x.watchStatus===filter:x.completion===filter)).filter(x=>`${x.title} ${x.review} ${x.category} ${x.era}`.toLowerCase().includes(q));$('list').innerHTML=shown.length?shown.map(entry=>{const progress=[entry.season&&`第 ${escapeHtml(entry.season)} 季`,entry.episode&&`第 ${escapeHtml(entry.episode)} 集`,entry.endingInfo&&`完結：${escapeHtml(entry.endingInfo)}`].filter(Boolean).join(' · ');return `<article class="item"><div class="badges"><span class="badge">${escapeHtml(entry.category||'未分類')}</span>${entry.era?`<span class="badge">${escapeHtml(entry.era)}</span>`:''}<span class="badge ${entry.completion==='已完結'?'complete':entry.completion==='未完結'?'incomplete':''}">${escapeHtml(entry.completion)}</span>${view==='watched'?`<span class="badge ${entry.watchStatus==='觀看中'?'watching':''}">${escapeHtml(entry.watchStatus)}</span>`:''}${stars(entry.rating)}</div><div class="title-line"><h2>${escapeHtml(entry.title)}</h2><button class="copy-title" data-copy="${escapeHtml(entry.title)}" type="button">複製</button></div>${progress?`<p class="meta">${progress}</p>`:''}${entry.review?`<p class="review">${escapeHtml(entry.review)}</p>`:''}</article>`}).join(''):`<div class="empty">目前沒有符合條件的劇集。</div>`}
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.tab.active').classList.remove('active');button.classList.add('active');view=button.dataset.view;filter='全部';render()}));
    $('filters').addEventListener('click',event=>{if(event.target.dataset.filter){filter=event.target.dataset.filter;render()}});$('search').addEventListener('input',render);$('list').addEventListener('click',async event=>{const button=event.target.closest('.copy-title');if(!button)return;try{await navigator.clipboard.writeText(button.dataset.copy);button.textContent='已複製';button.classList.add('copied');setTimeout(()=>{button.textContent='複製';button.classList.remove('copied')},1200)}catch{button.textContent='複製失敗'}});
    fetch(API,{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('load');return response.json()}).then(data=>{entries=Array.isArray(data.entries)?data.entries:[];render();if(data.updatedAt)$('updated').textContent=`最後更新：${new Date(data.updatedAt).toLocaleString('zh-TW')}`}).catch(()=>{$('list').innerHTML='<div class="empty">目前無法載入清單，請稍後再試。</div>'});
  </script>
</body>
</html>
